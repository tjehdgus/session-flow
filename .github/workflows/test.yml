name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test/smoke.js
      - run: node test/store.js
      - run: node test/harness.js
      - run: node test/extension.js
      - run: npm i --no-save jsdom@24 && node test/panel.js && node test/timeline.js
