name: Release extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: node test/smoke.js && node test/store.js && node test/harness.js && node test/extension.js && node test/panel.js && node test/timeline.js
      - name: Package .vsix
        working-directory: extension
        run: npx --yes @vscode/vsce package --no-dependencies -o ../session-flow.vsix
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: session-flow.vsix
      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: session-flow-vsix
          path: session-flow.vsix
